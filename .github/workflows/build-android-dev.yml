name: Build Android Dev APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/android/**"
      - "src/shared/**"
      - "deps/build_proot.sh"
      - "deps/proot/**"
      - "deps/talloc/**"
      - "scripts/prepare_android_sandbox.sh"
      - ".github/workflows/build-android-dev.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90


    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/android/**/*.gradle*

      - name: Set up Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Cache native Android artifacts
        uses: actions/cache@v4
        with:
          path: |
            deps/build/proot-android
            src/android/app/src/main/assets/alpine-minirootfs.tar.gz
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          key: android-native-${{ runner.os }}-${{ hashFiles('deps/build_proot.sh', 'deps/proot/**', 'deps/talloc/**', 'scripts/prepare_android_sandbox.sh') }}

      - name: Prepare build customization
        run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Build PRoot and Alpine sandbox
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Build signed release APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp src/android/app/build/outputs/apk/release/app-release.apk Minis-Dev-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-Dev-arm64-v8a
          path: Minis-Dev-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30