name: Build Isolated Auto Context Compact APKs

on:
  workflow_dispatch:
  push:
    branches: [fix/auto-context-compaction]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Cache native Android artifacts
        uses: actions/cache@v4
        with:
          path: |
            deps/build/proot-android
            src/android/app/src/main/assets/alpine-minirootfs.tar.gz
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          key: android-auto-compact-isolated-${{ runner.os }}-${{ hashFiles('deps/build_proot.sh', 'deps/proot/**', 'deps/talloc/**', 'scripts/prepare_android_sandbox.sh') }}

      - name: Prepare customization
        run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Build PRoot and Alpine sandbox
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Run unit tests and build release APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Collect universal and ABI APKs
        run: |
          mkdir -p dist
          cp src/android/app/build/outputs/apk/release/app-release.apk dist/Minis-AutoCompact-Isolated-universal.apk
          cp src/android/app/build/outputs/apk/release/app-release.apk dist/Minis-AutoCompact-Isolated-arm64-v8a.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Minis-AutoCompact-Isolated-APKs
          path: dist/
          if-no-files-found: error
          retention-days: 30
